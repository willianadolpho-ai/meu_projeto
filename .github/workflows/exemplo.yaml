name: Exemplo Workflow
on:
    push:
        branches: [main]
    workflow_dispatch:
jobs:
    verificar-repositorio:
        runs-on: ubuntu-latest

        steps:
            - name: Baixar arquivos do repositório
              uses: actions/checkout@v4
            - name: Exibir informações básicas do repositório
              run: |
                echo "Nome do repositório: ${{ github.repository }}"
                echo "Branch atual: ${{ github.ref }}"
                echo "Automação executada com sucesso!"
                ls -la
